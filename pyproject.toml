[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trs-isomorphic-search"
version = "0.1.0"
description = "TRS Alliance Structural Integrity Verification Engine - Graph Isomorphism Validation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.3",
    "rustworkx>=0.16",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
trs-iso = "trs_isomorphic_search.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
